<div class="min-h-screen bg-gradient-to-b from-blue-50 to-green-50">
  <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <h1 class="text-3xl font-bold mb-8 text-center text-gray-800">
      Kies Uw Rol en Type
    </h1>

    <div class="mb-12">
      <h2 class="text-2xl font-semibold mb-6 text-center text-gray-700">Selecteer uw rol:</h2>
      <div class="flex justify-center">
        <button *ngFor="let role of roles"
                (click)="selectRole(role.id)"
                class="flex flex-col items-center justify-center p-6 m-3 rounded-lg transition-all shadow-md hover:shadow-lg"
                [ngClass]="{'bg-blue-500 text-white': selectedRole === role.id, 'bg-white hover:bg-gray-100': selectedRole !== role.id}">
          <mat-icon [ngClass]="{'text-white': selectedRole === role.id, 'text-blue-500': selectedRole !== role.id}">{{role.icon}}</mat-icon>
          <span class="mt-3 text-lg font-semibold">{{role.name}}</span>
        </button>
      </div>
    </div>

    <div *ngIf="selectedRole" class="mb-12">
      <h2 class="text-2xl font-semibold mb-6 text-center text-gray-700">Selecteer uw type:</h2>
      <div class="flex justify-center flex-wrap">
        <button *ngFor="let type of types"
                (click)="selectType(type.id)"
                class="flex flex-col items-center justify-center p-6 m-3 rounded-lg transition-all shadow-md hover:shadow-lg"
                [ngClass]="{'bg-blue-500 text-white': selectedType === type.id, 'bg-white hover:bg-gray-100': selectedType !== type.id}">
          <mat-icon [ngClass]="{'text-white': selectedType === type.id, 'text-blue-500': selectedType !== type.id}">{{type.icon}}</mat-icon>
          <span class="mt-3 text-lg font-semibold">{{type.name}}</span>
        </button>
      </div>
    </div>

    <div *ngIf="selectedRole && selectedType" class="mt-12 text-center">
      <p class="text-xl font-semibold text-gray-800">
        U heeft gekozen:
        <span class="block mt-2 text-2xl text-blue-600">
          {{getSelectedRole()?.name}} - {{getSelectedType()?.name}}
        </span>
      </p>
      <button (click)="navigateToForm()" class="mt-8 bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-6 rounded-lg text-lg transition duration-300">
        Registreer
      </button>
    </div>
  </main>
</div>
