<div class="max-w-4xl mx-auto p-4 bg-gray-100">

  <h1 class="text-3xl font-bold text-center mb-8 text-gray-800">Debtor Dashboard</h1>

  <div class="grid gap-8 grid-cols-1 md:grid-cols-2">

    <app-upcoming-payments [payments]="samplePayments"></app-upcoming-payments>

    <app-payment-summary [totalDue]="paymentSummary.totalDue" [totalPaid]="paymentSummary.totalPaid" [remainingBalance]="paymentSummary.remainingBalance"></app-payment-summary>

  </div>
  <button (click)="navigateToSupplierDashboard()"
          type="submit"
          class="w-full bg-blue-600 text-white text-sm font-medium py-3 px-6 rounded-lg hover:bg-green-400 focus:outline-none focus:ring-2 focus:ring-green-400 focus:ring-opacity-50 transition duration-300 ease-in-out mt-8"
  >
    Go to supplier dashboard
  </button>

</div>
