<div class="max-w-4xl mx-auto p-6 bg-white rounded-lg shadow-xl">
  <h1 class="text-3xl font-bold mb-6 text-green-600">Create New Snappy</h1>
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-8">
    <!-- Debtor Data Frame -->
    <div class="bg-gray-50 p-6 rounded-lg">
      <h2 class="text-xl font-semibold mb-4 text-green-600">Debtor Data</h2>
      <div class="grid grid-cols-1 gap-6 md:grid-cols-2" formGroupName="debtorData">
        <div>
          <label for="debtorName" class="block text-sm font-medium text-gray-700">Debtor Name</label>
          <div class="mt-1 relative rounded-md shadow-sm">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <i class="lucide-user h-5 w-5 text-gray-400"></i>
            </div>
            <input type="text" id="debtorName" formControlName="name"
                   class="pl-10 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-500 focus:border-green-500"
                   placeholder="John Doe" required>
          </div>
        </div>
        <div>
          <label for="mobileNumber" class="block text-sm font-medium text-gray-700">Mobile Number</label>
          <div class="mt-1 relative rounded-md shadow-sm">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <i class="lucide-phone h-5 w-5 text-gray-400"></i>
            </div>
            <input type="tel" id="mobileNumber" formControlName="mobileNumber"
                   class="pl-10 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-500 focus:border-green-500"
                   placeholder="+1234567890" required>
          </div>
        </div>
        <div class="md:col-span-2">
          <label for="email" class="block text-sm font-medium text-gray-700">Email Address</label>
          <div class="mt-1 relative rounded-md shadow-sm">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <i class="lucide-mail h-5 w-5 text-gray-400"></i>
            </div>
            <input type="email" id="email" formControlName="email"
                   class="pl-10 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-500 focus:border-green-500"
                   placeholder="johndoe@example.com" required>
          </div>
        </div>
      </div>
    </div>

    <!-- Debt Information Frame -->
    <div class="bg-gray-50 p-6 rounded-lg">
      <h2 class="text-xl font-semibold mb-4 text-green-600">Debt Information</h2>

      <!-- Snappy Settings -->
      <div class="bg-white p-4 rounded-lg mb-6" formGroupName="snappySettings">
        <h3 class="text-lg font-semibold mb-2">Snappy Settings</h3>
        <div class="grid grid-cols-3 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700">Minimum Amount</label>
            <input type="number" formControlName="minAmount"
                   class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-500 focus:border-green-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">Maximum Months</label>
            <input type="number" formControlName="maxMonths"
                   class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-500 focus:border-green-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">Interest Rate (%)</label>
            <input type="number" formControlName="interestRate"
                   class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-500 focus:border-green-500">
          </div>
        </div>
      </div>

      <!-- Total Amount and Default Number of Months -->
      <div class="grid grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">Total Amount</label>
          <div class="mt-1 relative rounded-md shadow-sm">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <i class="lucide-credit-card h-5 w-5 text-gray-400"></i>
            </div>
            <input type="number" [(ngModel)]="totalAmount" [ngModelOptions]="{standalone: true}"
                   class="pl-10 block w-full pr-12 border border-gray-300 rounded-md p-2 focus:ring-green-500 focus:border-green-500"
                   placeholder="0.00" [disabled]="useInvoiceGrid" required>
            <div class="absolute inset-y-0 right-0 flex items-center">
              <select [(ngModel)]="currency" [ngModelOptions]="{standalone: true}"
                      class="focus:ring-green-500 focus:border-green-500 h-full py-0 pl-2 pr-7 border-transparent bg-transparent text-gray-500 sm:text-sm rounded-md">
                <option value="EUR">EUR</option>
                <option value="USD">USD</option>
                <option value="GBP">GBP</option>
              </select>
            </div>
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Default Number of Months</label>
          <div class="mt-1 relative rounded-md shadow-sm">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <i class="lucide-calendar h-5 w-5 text-gray-400"></i>
            </div>
            <input type="number" [(ngModel)]="defaultMonths" [ngModelOptions]="{standalone: true}"
                   class="pl-10 block w-full border border-gray-300 rounded-md p-2 focus:ring-green-500 focus:border-green-500"
                   required>
          </div>
        </div>
      </div>

      <!-- Invoice Grid Toggle -->
      <div class="flex items-center mb-4">
        <input type="checkbox" id="useInvoiceGrid" [(ngModel)]="useInvoiceGrid" [ngModelOptions]="{standalone: true}"
               class="h-4 w-4 text-green-600 focus:ring-green-500 border-gray-300 rounded">
        <label for="useInvoiceGrid" class="ml-2 block text-sm text-gray-900">
          Use invoice grid
        </label>
      </div>

      <!-- Invoice Grid -->
      @if (useInvoiceGrid) {
        <div class="mt-4">
          <h3 class="text-lg font-semibold mb-2">Invoices</h3>
          <div formArrayName="invoices">
            @for (invoice of invoicesFormArray.controls; track invoice; let i = $index) {
              <div [formGroupName]="i" class="flex space-x-2 mb-2">
                <input type="text" formControlName="number" placeholder="Invoice number"
                       class="invoice-input flex-1 border border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-500 focus:border-green-500">
                <input type="number" formControlName="amount" placeholder="Amount"
                       class="invoice-input flex-1 border border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-500 focus:border-green-500">
                @if (i > 0) {
                  <button type="button" (click)="removeInvoiceLine(i)"
                          class="p-2 bg-red-500 text-white rounded-md hover:bg-red-600">
                    <i class="lucide-trash-2" style="width: 18px; height: 18px;"></i>
                  </button>
                }
              </div>
            }
          </div>
          <button type="button" (click)="addInvoiceLine()"
                  class="mt-2 px-4 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600">
            Add Invoice Line
          </button>
        </div>
      }
    </div>

    <!-- Preview and Submit Buttons -->
    <div class="flex justify-between">
      <button type="button" (click)="togglePreview()"
              class="px-4 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600 transition-colors shadow-lg">
        Preview Snappy
      </button>
      <button (click)="goToDebtor()" type="submit"
              class="px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 transition-colors shadow-lg">
        Create Snappy
      </button>
    </div>
  </form>

  @if (showPreview) {
    <app-snappy-preview
      [totalAmount]="parseFloat(totalAmount)"
      [settings]="form.get('snappySettings')?.value"
      [defaultMonths]="defaultMonths"
      [invoices]="form.get('invoices')?.value"
      (close)="togglePreview()">
    </app-snappy-preview>
  }
</div>
