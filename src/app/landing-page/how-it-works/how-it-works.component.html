<section class="bg-white rounded-lg shadow-lg p-8 mb-16">
  <h3 class="text-2xl font-bold mb-6">Hoe Snappy Werkt</h3>
  <div class="grid md:grid-cols-4 gap-4">
    <div *ngFor="let step of steps; let i = index" class="flex items-center">
      <div class="bg-blue-500 text-white rounded-full w-8 h-8 flex items-center justify-center mr-3">
        {{ i + 1 }}
      </div>
      <p>{{ step }}</p>
    </div>
  </div>
</section>
