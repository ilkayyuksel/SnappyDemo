<div class="min-h-screen bg-gradient-to-b from-blue-50 to-green-50 p-4">
  <h1 class="text-2xl font-bold mb-4 text-blue-600 text-center">Snappy Debtor Registration</h1>

  <!-- Bedrijfsinformatie -->
  <div class="bg-white p-6 mb-4 rounded-lg shadow-md border-t-4 border-green-400">
    <h2 class="text-2xl font-semibold mb-4 text-blue-600">Bedrijfsinformatie</h2>
    <div class="grid grid-cols-3 gap-4">
      <div class="col-span-2">
        <label for="companyName" class="block text-sm font-medium text-gray-700 mb-1">Bedrijfsnaam</label>
        <input type="text" id="companyName" formControlName="companyName" class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent" value="Voorbeeld BV" required>
        <div *ngIf="formData.get('companyName')?.touched && formData.get('companyName')?.invalid" class="text-red-500 text-sm mt-1">
          Bedrijfsnaam is verplicht
        </div>
      </div>
      <div>
        <label for="vatNumber" class="block text-sm font-medium text-gray-700 mb-1">BTW-nummer</label>
        <input type="text" id="vatNumber" formControlName="vatNumber" class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent" value="NL123456789B01" required>
        <div *ngIf="formData.get('vatNumber')?.touched && formData.get('vatNumber')?.invalid" class="text-red-500 text-sm mt-1">
          BTW-nummer is verplicht
        </div>
      </div>
    </div>
    <div class="grid grid-cols-3 gap-4 mt-4">
      <div class="col-span-2">
        <label for="address" class="block text-sm font-medium text-gray-700 mb-1">Adres</label>
        <input type="text" id="addressCompany" formControlName="address" class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent" value="Voorbeeldstraat 123" required>
        <div *ngIf="formData.get('addressCompany')?.touched && formData.get('addressCompany')?.invalid" class="text-red-500 text-sm mt-1">
          Adres is verplicht
        </div>
      </div>
      <div>
        <label for="postalCode" class="block text-sm font-medium text-gray-700 mb-1">Postcode</label>
        <input type="text" id="postalCodeCompany" formControlName="postalCode" class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent" value="1234 AB" required>
        <div *ngIf="formData.get('postalCodeCompany')?.touched && formData.get('postalCodeCompany')?.invalid" class="text-red-500 text-sm mt-1">
          Postcode is verplicht
        </div>
      </div>
    </div>
    <div class="grid grid-cols-3 gap-4 mt-4">
      <div class="col-span-2">
        <label for="city" class="block text-sm font-medium text-gray-700 mb-1">Plaats</label>
        <input type="text" id="cityCompany" formControlName="city" class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent" value="Amsterdam" required>
        <div *ngIf="formData.get('cityCompany')?.touched && formData.get('cityCompany')?.invalid" class="text-red-500 text-sm mt-1">
          Plaats is verplicht
        </div>
      </div>
    </div>
  </div>

  <form (submit)="handleSubmit($event)" class="space-y-4">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="bg-white p-4 rounded-lg shadow border-l-4 border-green-400">
        <h2 class="text-xl font-semibold mb-3 text-blue-600">Contact Information</h2>
        <div class="space-y-3">
          <div>
            <label for="lastName" class="block text-sm font-medium text-gray-700">Last Name</label>
            <input
              type="text"
              id="lastName"
              name="lastName"
              [(ngModel)]="formData.lastName"
              (input)="handleInputChange($event, 'lastName')"
              class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-400 focus:border-green-400"
              required
            />
          </div>
          <div>
            <label for="firstName" class="block text-sm font-medium text-gray-700">First Name</label>
            <input
              type="text"
              id="firstName"
              name="firstName"
              [(ngModel)]="formData.firstName"
              (input)="handleInputChange($event, 'firstName')"
              class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-400 focus:border-green-400"
              required
            />
          </div>
          <div>
            <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              [(ngModel)]="formData.email"
              (input)="handleInputChange($event, 'email')"
              class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-400 focus:border-green-400"
              required
            />
          </div>
          <div>
            <label for="mobileNumber" class="block text-sm font-medium text-gray-700">Mobile Number</label>
            <input
              type="tel"
              id="mobileNumber"
              name="mobileNumber"
              [(ngModel)]="formData.mobileNumber"
              (input)="handleInputChange($event, 'mobileNumber')"
              class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-400 focus:border-green-400"
              required
            />
          </div>
        </div>
      </div>

      <div class="bg-white p-4 rounded-lg shadow border-l-4 border-green-400">
        <h2 class="text-xl font-semibold mb-3 text-blue-600">Address Details</h2>
        <div class="space-y-3">
          <div>
            <label for="address" class="block text-sm font-medium text-gray-700">Address</label>
            <input
              type="text"
              id="address"
              name="address"
              [(ngModel)]="formData.address"
              (input)="handleInputChange($event, 'address')"
              class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-400 focus:border-green-400"
              required
            />
          </div>
          <div>
            <label for="houseNumber" class="block text-sm font-medium text-gray-700">House Number</label>
            <input
              type="text"
              id="houseNumber"
              name="houseNumber"
              [(ngModel)]="formData.houseNumber"
              (input)="handleInputChange($event, 'houseNumber')"
              class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-400 focus:border-green-400"
              required
            />
          </div>
          <div>
            <label for="postalCode" class="block text-sm font-medium text-gray-700">Postal Code</label>
            <input
              type="text"
              id="postalCode"
              name="postalCode"
              [(ngModel)]="formData.postalCode"
              (input)="handleInputChange($event, 'postalCode')"
              class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-400 focus:border-green-400"
              required
            />
          </div>
          <div>
            <label for="city" class="block text-sm font-medium text-gray-700">City</label>
            <input
              type="text"
              id="city"
              name="city"
              [(ngModel)]="formData.city"
              (input)="handleInputChange($event, 'city')"
              class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-400 focus:border-green-400"
              required
            />
          </div>
        </div>
      </div>
    </div>

    <form (submit)="handleSubmit($event)" class="space-y-4 max-w-7xl mx-auto"> <!-- Increased max-width -->
      <div class="grid grid-cols-1 gap-4">
        <div class="bg-white p-6 rounded-lg shadow border-l-4 border-green-400"> <!-- Increased padding -->
          <h2 class="text-2xl font-semibold mb-4 text-blue-600">Additional Contactperson</h2> <!-- Increased text and margin -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6"> <!-- Changed to 2 columns for wider layout -->
            <div>
              <label for="lastName" class="block text-sm font-medium text-gray-700">Last Name</label>
              <input
                type="text"
                id="lastName2"
                name="lastName"

                (input)="handleInputChange($event, 'lastName')"
                class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-400 focus:border-green-400"
                required
              />
            </div>
            <div>
              <label for="firstName" class="block text-sm font-medium text-gray-700">First Name</label>
              <input
                type="text"
                id="firstName2"
                name="firstName"

                (input)="handleInputChange($event, 'firstName')"
                class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-400 focus:border-green-400"
                required
              />
            </div>
            <div>
              <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
              <input
                type="email"
                id="email2"
                name="email"

                (input)="handleInputChange($event, 'email')"
                class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-400 focus:border-green-400"
                required
              />
            </div>
            <div>
              <label for="mobileNumber" class="block text-sm font-medium text-gray-700">Mobile Number</label>
              <input
                type="tel"
                id="mobileNumber2"
                name="mobileNumber"

                (input)="handleInputChange($event, 'mobileNumber')"
                class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-400 focus:border-green-400"
                required
              />
            </div>
          </div>
        </div>
      </div>
    </form>

    <button (click)="navigateToWelcomePage()"
      type="submit"
      class="w-full bg-blue-600 text-white text-sm font-medium py-3 px-6 rounded-lg hover:bg-green-400 focus:outline-none focus:ring-2 focus:ring-green-400 focus:ring-opacity-50 transition duration-300 ease-in-out"
    >
      Register
    </button>
  </form>
</div>
